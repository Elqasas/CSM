{% extends "base.html" %}

{% comment %}
The narrow centred card the forgot-password steps share with sign-in, without
sign-in's animated background: these pages are a detour, not a front door.
{% endcomment %}
{% block content %}
  <div class="row justify-content-center">
    <div class="col-12 col-sm-9 col-md-6 col-lg-4">
      <div class="card shadow-sm mt-5">
        <div class="card-body p-4">
          {% block card %}{% endblock %}
        </div>
      </div>
    </div>
  </div>
{% endblock %}
